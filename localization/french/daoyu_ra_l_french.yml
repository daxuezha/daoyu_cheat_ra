l_french:
 daoyu_ra_arrange_accident_exile:0 "#V Daoyu Cheat#!Arrange Accident"
 daoyu_set_character_as_ig_leader:0 "Become Interest Group Leader"
 daoyu_ra_invite_agitator_now:0 "#V Daoyu Cheat#!Invite Now"
 daoyu_ra_invite_agitator_now_desc:0 "#lore Immediately invite this agitator into one of our agitator slots, bypassing the five-year agitator recruitment restriction.#!"
 daoyu_ra_convert_to_agitator:0 "Convert to Agitator"
 daoyu_ra_convert_to_agitator_desc:0 "#lore Strip this character's current roles and turn them into an agitator; an agitator slot is added temporarily if none is free.#!"
 daoyu_ra_assign_movement:0 "Assign Political Movement"
 daoyu_ra_assign_movement_desc:0 "#lore Pick the political movement this agitator may take part in.\n\nThe movement is created in their country if it does not exist, and **only this character's** ideology is changed so that the engine accepts them as a supporter. Other characters are left untouched.#!"
 daoyu_ra_recruit_as_politician:0 "Recruit as Politician"
 daoyu_ra_recruit_as_politician_desc:0 "#lore Recruit this character into our government as a politician.#!"
 daoyu_ra_recruit_as_general:0 "Recruit as General"
 daoyu_ra_recruit_as_general_desc:0 "#lore Recruit this character as a general in our army.#!"
 daoyu_ra_recruit_as_admiral:0 "Recruit as Admiral"
 daoyu_ra_recruit_as_admiral_desc:0 "#lore Recruit this character as an admiral in our navy.#!"
 daoyu_ra_mv_auto:0 "Auto-match Movement"
 daoyu_ra_mv_auto_desc:0 "#lore Create the political movement that best matches this character's current ideology, and make sure they can join it.#!"
 movement_usfp_american_constitution:0 "American Constitution Movement"
 movement_usfp_neoconfederate:0 "Neo-Confederate Movement"
 movement_scandinavia_pan_national:0 "Scandinavian Pan-National Movement"

 daoyu_ra_grant_army_command:0 "#V Daoyu Cheat#!Grant Army Command"
 daoyu_ra_grant_army_command_desc:0 "#lore Give this politician/agitator an army command. They keep their current post and also become a general.#!"
 daoyu_ra_remove_army_command:0 "#V Daoyu Cheat#!Revoke Army Command"
 daoyu_ra_remove_army_command_desc:0 "#lore Remove only the general post. The character stays in the character pool and can still be managed.#!"
 daoyu_ra_grant_navy_command:0 "#V Daoyu Cheat#!Grant Navy Command"
 daoyu_ra_grant_navy_command_desc:0 "#lore Give this politician/agitator a navy command. They keep their current post and also become an admiral.#!"
 daoyu_ra_remove_navy_command:0 "#V Daoyu Cheat#!Revoke Navy Command"
 daoyu_ra_remove_navy_command_desc:0 "#lore Remove only the admiral post. The character stays in the character pool and can still be managed.#!"
